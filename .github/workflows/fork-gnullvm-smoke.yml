name: Fork Windows ARM64 gnullvm smoke

on:
  push:
    branches: [windows-arm64-gnullvm-smoke]

jobs:
  build:
    runs-on: windows-11-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Windows ARM64 GNU-family toolchain
        if: true
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: CLANGARM64
          update: true
          install: mingw-w64-clang-aarch64-clang

      - name: Use Windows ARM64 GNU-family toolchain
        if: true
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $bin = "$env:MSYS2_LOCATION\clangarm64\bin"
          echo $bin >> $env:GITHUB_PATH
          echo "CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_LINKER=$bin\clang.exe" >> $env:GITHUB_ENV
          echo "CC_aarch64_pc_windows_gnullvm=$bin\clang.exe" >> $env:GITHUB_ENV
          echo "AR_aarch64_pc_windows_gnullvm=$bin\llvm-ar.exe" >> $env:GITHUB_ENV
          # Link libunwind statically so the release does not need MSYS2's libunwind.dll.
          echo "CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV

      - name: Read Rust version
        shell: bash
        run: echo "RUST_VERSION=$(cat .github/ci/rust_version.txt)" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: aarch64-pc-windows-gnullvm

      - name: Build (same command as build_releases.yml)
        shell: bash
        env:
          BTM_GENERATE: true
        run: cargo build --release --locked --target=aarch64-pc-windows-gnullvm --features deploy

      - name: Check the binary runs without MSYS2
        shell: pwsh
        run: |
          $exe = "target/aarch64-pc-windows-gnullvm/release/btm.exe"
          llvm-readobj --coff-imports $exe | Select-String 'Name: ' | Sort-Object -Unique
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "btm.exe failed to start without MSYS2 on PATH" }
